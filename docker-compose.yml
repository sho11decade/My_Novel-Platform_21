services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      DATABASE_URL: postgres://novel:novel@db:5432/novel_platform?sslmode=disable
      JWT_SECRET: change-me
    volumes:
      - ./backend:/app
    depends_on:
      - db

  db:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: novel_platform
      POSTGRES_USER: novel
      POSTGRES_PASSWORD: novel
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
